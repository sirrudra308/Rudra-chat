
name: Build Rudra Chat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rudra_Chat_Repo_Upload_Pack.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f Rudra_Chat_Repo_Upload_Pack.zip || {
            echo "Project ZIP is missing from repository root"
            exit 1
          }

      - name: Extract project
        run: |
          mkdir _buildsrc
          unzip Rudra_Chat_Repo_Upload_Pack.zip -d _buildsrc
          find _buildsrc -name pubspec.yaml -print

      - name: Locate Flutter app
        run: |
          APP_DIR="$(find _buildsrc -name pubspec.yaml -print -quit | xargs dirname)"
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --project-name rudra_chat /tmp/rudra_shell
          cp -r /tmp/rudra_shell/android "$APP_DIR/"
          sed -i 's/android:label="rudra_chat"/android:label="Rudra Chat"/' "$APP_DIR/android/app/src/main/AndroidManifest.xml" || true

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rudra-chat-debug-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
