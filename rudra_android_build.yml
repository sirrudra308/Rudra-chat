name: Build Rudra Chat Android debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Rudra_Chat_Repo_Upload_Pack.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract app source package
        run: |
          test -f Rudra_Chat_Repo_Upload_Pack.zip
          mkdir -p _buildsrc
          unzip -q Rudra_Chat_Repo_Upload_Pack.zip -d _buildsrc
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: _buildsrc/flutter_app
        run: |
          mkdir -p /tmp/rudra_android_shell
          flutter create --platforms=android --project-name rudra_chat --org com.rudra.chat /tmp/rudra_android_shell
          cp -R /tmp/rudra_android_shell/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              i = s.find('>')
              s = s[:i+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + s[i+1:]
          p.write_text(s)
          PY
      - name: Resolve packages
        working-directory: _buildsrc/flutter_app
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: _buildsrc/flutter_app
        run: flutter analyze
      - name: Run widget tests
        working-directory: _buildsrc/flutter_app
        run: flutter test
      - name: Build debug APK
        working-directory: _buildsrc/flutter_app
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rudra-chat-debug-apk
          path: _buildsrc/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
